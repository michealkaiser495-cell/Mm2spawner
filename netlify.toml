# Netlify config for deploying Nocta (static build + the Crossmint order function).
# Netlify reads this from the repo root. Deploy via "Import from GitHub" (drag-and-drop cannot run functions).
[build]
  base = "wallet"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
